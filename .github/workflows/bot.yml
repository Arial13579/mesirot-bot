name: mesirot-bot
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mesirot-bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Agora and notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py
      - name: Save seen ads
        run: |
          git config user.name "mesirot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -qm "עדכון מודעות שנבדקו" && git push -q)
