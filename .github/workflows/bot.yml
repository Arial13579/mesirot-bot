name: mesirot-bot
# כל ריצה: בדיקה אחת, שמירה, המתנה של 10 דקות, ואז מפעילה את הריצה הבאה.
# התזמון של GitHub נשאר כגיבוי, למקרה שהשרשרת נעצרת.
on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mesirot-bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Agora and notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py
      - name: Save seen ads
        run: |
          git config user.name "mesirot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -qm "עדכון מודעות שנבדקו"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          echo "! השמירה נכשלה"; exit 1
      - name: Wait 10 minutes and start the next run
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
