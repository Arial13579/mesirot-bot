name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" -o list.html "https://www.agora.co.il/toGet.asp?dealType=1"
          curl -sSL -A "$UA" -o list2.html "https://www.agora.co.il/toGet.asp?dealType=1&page=2"
          curl -sSL -A "$UA" -o cat2.html "https://www.agora.co.il/toGet.asp?searchType=categorySearch&dealType=1&iseek=2"
          id=$(grep -o '/cache/[0-9-]*/[0-9]*_o.asp' list.html | head -1)
          curl -sSL -A "$UA" -o item.html "https://www.agora.co.il$id"
          curl -sSL -A "$UA" -o amp.html "https://www.agora.co.il/toGetAMP.asp?dealType=1"
          curl -sSL -A "$UA" -o yad2.html "https://www.yad2.co.il/products/all?price=0-0"
          ls -la
          for f in *.html; do echo "BEGIN $f"; gzip -9c $f | base64 -w 0; echo; echo "END $f"; done
